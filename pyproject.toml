[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task_manager"
version = "0.1.0"
description = "A command-line task manager"
requires-python = ">=3.8"
dependencies = [
    "platformdirs>=4.0.0"
]

[project.scripts]
task-manager = "task_manager.main:main"